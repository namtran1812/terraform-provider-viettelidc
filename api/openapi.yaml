openapi: 3.0.3
info: {title: Viettel Infrastructure Monitoring API, version: 0.1.0}
servers: [{url: http://localhost:8080}]
paths:
  /healthz:
    get: {responses: {'200': {description: healthy}}}
  /auth/token:
    post: {responses: {'200': {description: JWT token}}}
  /v1/servers:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: server list}}}
    post: {security: [{bearerAuth: []}], responses: {'201': {description: created}}}
  /v1/servers/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get: {security: [{bearerAuth: []}], responses: {'200': {description: server}, '404': {description: not found}}}
    patch: {security: [{bearerAuth: []}], responses: {'200': {description: updated}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
