syntax = "proto3";
package monitoring.v1;
option go_package = "github.com/vmware/terraform-provider-vcd/v3/gen/monitoring/v1;monitoringv1";
message CheckRequest { string server_id = 1; string address = 2; }
message CheckResponse { string server_id = 1; bool up = 2; int64 latency_ms = 3; string checked_at = 4; string error = 5; }
service MonitoringService { rpc Check(CheckRequest) returns (CheckResponse); rpc CheckBatch(stream CheckRequest) returns (stream CheckResponse); }
